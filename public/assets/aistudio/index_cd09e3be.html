<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Calculator - Lakmina King👑️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #05050a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            background-image: radial-gradient(circle at 50% 20%, rgba(0, 255, 204, 0.1), transparent 60%);
        }

        .calculator-card {
            background: rgba(12, 16, 33, 0.9);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 255, 204, 0.3);
            padding: 25px 20px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 25px rgba(0, 255, 204, 0.2);
            width: 100%;
            max-width: 380px;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .calculator-card:hover {
            transform: translateY(-5px) rotateX(2deg) rotateY(-2deg);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 35px rgba(0, 255, 204, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            color: #00ffcc;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 5px;
        }

        .header p {
            color: #8a99ad;
            font-size: 12px;
        }

        .display-screen {
            background: #04060a;
            border: 1px solid rgba(0, 255, 204, 0.4);
            border-radius: 14px;
            padding: 18px;
            font-size: 28px;
            font-weight: bold;
            color: #00ffcc;
            text-align: right;
            margin-bottom: 20px;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            word-break: break-all;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .calc-btn {
            background: linear-gradient(145deg, #161c38, #0c1021);
            color: #e2e8f0;
            border: 1px solid rgba(0, 255, 204, 0.2);
            padding: 16px 0;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.4);
            transition: all 0.15s ease;
        }

        .calc-btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .calc-btn:hover {
            border-color: #00ffcc;
            color: #00ffcc;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.3);
        }

        .btn-operator {
            background: linear-gradient(145deg, #1f1035, #120822);
            border-color: rgba(219, 39, 119, 0.3);
            color: #f472b6;
        }

        .btn-operator:hover {
            border-color: #db2777;
            color: #f472b6;
            box-shadow: 0 0 12px rgba(219, 39, 119, 0.4);
        }

        .btn-action {
            background: linear-gradient(145deg, #2b0b14, #18050b);
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        .btn-action:hover {
            border-color: #ef4444;
            color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
        }

        .btn-equal {
            background: linear-gradient(135deg, #00ffcc, #00b390);
            color: #05050a;
            border: none;
            box-shadow: 0 5px 15px rgba(0, 255, 204, 0.4);
        }

        .btn-equal:hover {
            background: linear-gradient(135deg, #3fffdb, #00cca3);
            color: #05050a;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.7);
        }

        .footer-note {
            text-align: center;
            margin-top: 20px;
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <div class="header">
        <h1>L-S Calculator 🧮</h1>
        <p>Manuu👑️</p>
    </div>

    <div class="display-screen" id="display">0</div>

    <div class="keypad-grid">
        <button class="calc-btn btn-action" onclick="clearDisplay()">AC</button>
        <button class="calc-btn btn-operator" onclick="appendValue('(')">(</button>
        <button class="calc-btn btn-operator" onclick="appendValue(')')">)</button>
        <button class="calc-btn btn-operator" onclick="appendValue('/')">÷</button>

        <button class="calc-btn" onclick="appendValue('7')">7</button>
        <button class="calc-btn" onclick="appendValue('8')">8</button>
        <button class="calc-btn" onclick="appendValue('9')">9</button>
        <button class="calc-btn btn-operator" onclick="appendValue('*')">×</button>

        <button class="calc-btn" onclick="appendValue('4')">4</button>
        <button class="calc-btn" onclick="appendValue('5')">5</button>
        <button class="calc-btn" onclick="appendValue('6')">6</button>
        <button class="calc-btn btn-operator" onclick="appendValue('-')">-</button>

        <button class="calc-btn" onclick="appendValue('1')">1</button>
        <button class="calc-btn" onclick="appendValue('2')">2</button>
        <button class="calc-btn" onclick="appendValue('3')">3</button>
        <button class="calc-btn btn-operator" onclick="appendValue('+')">+</button>

        <button class="calc-btn" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
        <button class="calc-btn" onclick="appendValue('.')">.</button>
        <button class="calc-btn btn-equal" onclick="calculateResult()">=</button>
    </div>

    <div class="footer-note">
      SANJANA 🌙
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendValue(val) {
        if (display.textContent === '0' && val !== '.') {
            display.textContent = val;
        } else {
            display.textContent += val;
        }
    }

    function clearDisplay() {
        display.textContent = '0';
    }

    function calculateResult() {
        try {
            // විශේෂ රහස් කොන්දේසිය පරීක්ෂා කිරීම (2005 - 2006)
            let currentText = display.textContent.trim();
            // spaces ඉවත් කර බැලීම
            let cleanedText = currentText.replace(/\s+/g, '');

            if (cleanedText === '2005-2006') {
                display.textContent = 'Redirecting...';
                setTimeout(() => {
                    window.location.href = '1.html';
                }, 800);
                return;
            }

            // සාමාන්‍ය ගණනය කිරීම් සිදු කිරීම
            let result = eval(display.textContent);
            
            // 2005 සිට 2006 අඩු කිරීමේ ප්‍රතිඵලය (-1) පරීක්ෂා කිරීම හෝ සෘජු ගණනය කිරීම
            if (result === -1 && (cleanedText.includes('2005-2006') || cleanedText === '2005-2006')) {
                display.textContent = 'Redirecting...';
                setTimeout(() => {
                    window.location.href = '1.html';
                }, 800);
                return;
            }

            display.textContent = result;
        } catch (error) {
            display.textContent = 'দෝෂයක් (Error)';
            setTimeout(() => {
                display.textContent = '0';
            }, 1200);
        }
    }
</script>

</body>
</html>
